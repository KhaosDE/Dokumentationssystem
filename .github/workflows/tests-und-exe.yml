name: Tests und Windows-Programm

# Vorbild: KhaosDE/N3XTBYT3. Release nur bei Push nach main – nicht, wenn sich nur
# .md-Dateien ändern (der Chat schreibt Aufträge direkt in IDEEN.md auf main).
# Wichtig: Dateiname dieses Workflows nicht ändern. Die Laufnummer (= Build-Nummer im
# Release-Namen build-<Nummer>) zählt je Workflow-Datei; eine neue Datei finge wieder bei 1
# an, und installierte Programme sähen kein neueres Release mehr.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  tests:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Format prüfen (Leerzeichen und Einrückung nach .editorconfig)
        run: dotnet format whitespace --folder --verify-no-changes -v q
      - name: Code-Maße nach docs/code-regeln.md (Hinweis, kein Fehler)
        continue-on-error: true
        run: python werkzeuge/code-masse.py
      - name: Bildschirm 1920 × 1080 (für Bildschirmfotos in voller Größe; scheitert es, bleibt 1024 × 768)
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "Bildschirm jetzt: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
      - name: Tests (Kern, Update, Oberfläche)
        env:
          DOKUSYSTEM_BILDSCHIRMFOTOS: ${{ github.workspace }}\bildschirmfotos
        run: dotnet test DokuLine.sln -c Release --logger "console;verbosity=normal"
      - name: Bildschirmfotos zur Sichtprüfung bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bildschirmfotos
          path: bildschirmfotos/
          retention-days: 14
          if-no-files-found: ignore

  exe:
    name: Windows-Programm (.exe)
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write  # für das Release, aus dem sich die .exe selbst aktualisiert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: .exe bauen (eine Datei, mit .NET, nicht komprimiert)
        run: >
          dotnet publish src/DokuLine/DokuLine.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:BuildNummer=${{ github.run_number }}
          -o publish
      - name: Selbsttest der .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish\DokuLine.exe" -ArgumentList "--selbsttest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path selbsttest.log) { Get-Content selbsttest.log }
            throw "Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))"
          }
          Write-Host "Selbsttest bestanden. Größe: $([math]::Round((Get-Item publish\DokuLine.exe).Length / 1MB)) MB"
      - name: .exe zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: DokuLine-Windows
          path: publish/DokuLine.exe
          retention-days: 30
      - name: Release veröffentlichen (für das Selbst-Update und den festen Download-Link)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Übergang (Bauplan Schritt 26a1): dieselbe Datei zusätzlich als Dokumentationssystem.exe,
          # damit Installationen bis 0.29.1 sie finden (sie suchen nur diesen Namen).
          Copy-Item publish\DokuLine.exe publish\Dokumentationssystem.exe
          foreach ($name in "DokuLine.exe", "Dokumentationssystem.exe") {
            $hash = (Get-FileHash "publish\$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content -NoNewline -Encoding utf8NoBOM "publish\$name.sha256"
          }
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          $tag = "build-${{ github.run_number }}"
          gh release create $tag publish\DokuLine.exe publish\DokuLine.exe.sha256 `
            publish\Dokumentationssystem.exe publish\Dokumentationssystem.exe.sha256 `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest `
            --title "DokuLine $version (Build ${{ github.run_number }})" `
            --notes "Version $version, automatisch gebaut aus ${{ github.sha }}. Die .exe aktualisiert sich beim Start selbst auf den neuesten Build. Demo – nur ausgedachte Daten."
      - name: Alte Releases aufräumen (die neuesten 10 bleiben)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $alle = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt | ConvertFrom-Json
          $alt = $alle | Where-Object { $_.tagName -like 'build-*' } | Sort-Object createdAt -Descending | Select-Object -Skip 10
          foreach ($r in $alt) { gh release delete $r.tagName --repo "${{ github.repository }}" --yes --cleanup-tag }
