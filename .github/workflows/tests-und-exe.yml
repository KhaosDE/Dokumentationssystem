name: Tests und Windows-Programm

# Vorbild: KhaosDE/N3XTBYT3. Release nur bei Push nach main – nicht, wenn sich nur
# .md-Dateien ändern (der Chat schreibt Aufträge direkt in IDEEN.md auf main).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest -v

  exe:
    name: Windows-Programm (.exe)
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write  # für das Release, aus dem sich die .exe selbst aktualisiert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Build-Nummer eintragen (= Laufnummer)
        run: python -c "open('dokusystem/_build.py', 'w', encoding='utf-8').write('BUILD = ${{ github.run_number }}\n')"
      - name: .exe bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name Dokumentationssystem
          --add-data "daten;daten"
          start_dokusystem.py
      - name: Selbsttest der .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Dokumentationssystem.exe" -ArgumentList "--selbsttest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path selbsttest.log) { Get-Content selbsttest.log }
            throw "Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))"
          }
          Write-Host "Selbsttest bestanden."
      - name: .exe zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Dokumentationssystem-Windows
          path: dist/Dokumentationssystem.exe
          retention-days: 30
      - name: Release veröffentlichen (für das Selbst-Update und den festen Download-Link)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist\Dokumentationssystem.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Dokumentationssystem.exe" | Set-Content -NoNewline -Encoding utf8NoBOM dist\Dokumentationssystem.exe.sha256
          $version = python -c "from dokusystem._version import VERSION; print(VERSION)"
          $tag = "build-${{ github.run_number }}"
          gh release create $tag dist\Dokumentationssystem.exe dist\Dokumentationssystem.exe.sha256 `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest `
            --title "Dokumentationssystem $version (Build ${{ github.run_number }})" `
            --notes "Version $version, automatisch gebaut aus ${{ github.sha }}. Die .exe aktualisiert sich beim Start selbst auf den neuesten Build. Demo – nur ausgedachte Daten."
      - name: Alte Releases aufräumen (die neuesten 10 bleiben)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $alle = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt | ConvertFrom-Json
          $alt = $alle | Where-Object { $_.tagName -like 'build-*' } | Sort-Object createdAt -Descending | Select-Object -Skip 10
          foreach ($r in $alt) { gh release delete $r.tagName --repo "${{ github.repository }}" --yes --cleanup-tag }
